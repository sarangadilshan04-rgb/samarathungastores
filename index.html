<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - Samarathunga Stores</title>
    <style>
        /* Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Shining Stars Background */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* Main Content Container */
        .content-wrapper {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(10, 10, 15, 0.7);
            padding: 50px 40px;
            border-radius: 15px;
            border: 1px solid rgba(77, 166, 255, 0.2);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.15), inset 0 0 20px rgba(77, 166, 255, 0.05);
            backdrop-filter: blur(8px);
            max-width: 90%;
            width: 500px;
        }

        /* Logo Styling */
        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(52, 152, 219, 0.6));
        }

        /* Typography */
        h1 {
            margin: 0 0 15px 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #9b59b6, #3498db, #9b59b6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            text-transform: uppercase;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        p {
            font-size: 1.1rem;
            color: #a0aec0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .highlight {
            color: #3498db;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 0 0 8px rgba(52, 152, 219, 0.8);
        }

        /* Neon Cyber Button */
        .btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: transparent;
            border: 2px solid #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3), inset 0 0 10px rgba(52, 152, 219, 0.2);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: rgba(52, 152, 219, 0.1);
            border-color: #9b59b6;
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.6), inset 0 0 15px rgba(155, 89, 182, 0.4);
            text-shadow: 0 0 5px #fff;
        }
    </style>
</head>
<body>

    <!-- Shining Stars Background -->
    <div id="stars-container"></div>

    <!-- Main Content -->
    <div class="content-wrapper">
        <img src="ChatGPT Image May 23, 2026, 01_28_55 AM.png" alt="Samarathunga Stores Logo" class="logo">
        
        <h1>Samarathunga Stores</h1>
        <p>We have migrated our website to a new host to bring you a better experience.</p>
        <p>You will be redirected to our new home in <span id="countdown" class="highlight">7</span> seconds...</p>
        
        <a href="http://samarathungast.byethost4.com" class="btn">Go to New Site Now</a>
    </div>

    <script>
        // 1. Generate Shining Stars Animation
        function initStars() {
            const container = document.getElementById('stars-container');
            const starCount = 120; // Adjust for more or fewer stars
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Randomize position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                // Randomize size and timing
                const size = Math.random() * 2.5 + 1;
                const duration = Math.random() * 3 + 2;
                const delay = Math.random() * 5;
                
                // Randomize glow colors to match logo theme (Blue & Purple)
                const isPurple = Math.random() > 0.5;
                if(isPurple) {
                    star.style.boxShadow = '0 0 6px #9b59b6';
                } else {
                    star.style.boxShadow = '0 0 6px #3498db';
                }

                star.style.left = `${x}vw`;
                star.style.top = `${y}vh`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.animationDuration = `${duration}s`;
                star.style.animationDelay = `${delay}s`;
                
                container.appendChild(star);
            }
        }

        // 2. Countdown Timer and Redirection
        function initRedirect() {
            let timeLeft = 7;
            const countdownEl = document.getElementById('countdown');
            const targetUrl = "http://samarathungast.byethost4.com";
            
            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    window.location.href = targetUrl;
                }
            }, 1000);
        }

        // Run functions on load
        window.onload = () => {
            initStars();
            initRedirect();
        };
    </script>
</body>
</html>
